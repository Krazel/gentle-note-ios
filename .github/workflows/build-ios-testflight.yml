name: Build Gentle Note for TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the verified signed IPA to TestFlight
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-sign-and-upload:
    environment: app-store-production
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_BUNDLE_ID: com.krazel.gentlenote.B2X6D3A9J9
      APPLE_TEAM_ID: B2X6D3A9J9
    steps:
      - name: Check out approved source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode and verify source contract
        shell: pwsh
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          $SdkVersion = xcrun --sdk iphoneos --show-sdk-version
          if ([int]($SdkVersion.Split('.')[0]) -lt 26) { throw "iOS SDK 26 or newer is required; found $SdkVersion" }
          ./scripts/verify.ps1

      - name: Run XCTest suite
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild test \
            -project GentleNote.xcodeproj \
            -scheme GentleNote \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/SimulatorDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Import dedicated signing identity and profile
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/GentleNote-Distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/GentleNote-AppStore.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/gentle-note-signing.keychain-db"
          PROFILE_PLIST="$RUNNER_TEMP/GentleNote-AppStore.plist"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$PROFILE_PLIST")
          test "$PROFILE_TEAM" = "$APPLE_TEAM_ID"
          test "$PROFILE_APP_ID" = "$APPLE_TEAM_ID.$APP_BUNDLE_ID"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Archive signed application
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild archive \
            -project GentleNote.xcodeproj \
            -scheme GentleNote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GentleNote.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN"

      - name: Export and verify signed IPA
        shell: bash
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          EXPORT_PATH="$RUNNER_TEMP/TestFlightExport"
          cat > "$EXPORT_OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>provisioningProfiles</key><dict>
              <key>${APP_BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GentleNote.xcarchive" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN"

          IPA_PATH=$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          APP_PATH="$RUNNER_TEMP/GentleNote.xcarchive/Products/Applications/GentleNote.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")" = "$APP_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "0.7.1"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP_PATH/Info.plist")" = "1"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP_PATH/Info.plist")" = "AppIcon"
          ICON_120_PATH=""
          while IFS= read -r ICON_PATH; do
            ICON_WIDTH=$(sips -g pixelWidth "$ICON_PATH" | awk '/pixelWidth/ {print $2}')
            ICON_HEIGHT=$(sips -g pixelHeight "$ICON_PATH" | awk '/pixelHeight/ {print $2}')
            if [[ "$ICON_WIDTH" = "120" && "$ICON_HEIGHT" = "120" ]]; then
              ICON_120_PATH="$ICON_PATH"
              break
            fi
          done < <(find "$APP_PATH" -maxdepth 1 -type f -name 'AppIcon*.png' -print)
          test -n "$ICON_120_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ARCHIVE_PROFILE_PLIST="$RUNNER_TEMP/GentleNote-Archive-Profile.plist"
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$ARCHIVE_PROFILE_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print UUID' "$ARCHIVE_PROFILE_PLIST")" = "$PROFILE_UUID"
          shasum -a 256 "$IPA_PATH" > "$IPA_PATH.sha256"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        shell: bash
        env:
          ASC_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          API_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEYS_DIR"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$API_KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$API_KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Preserve signed IPA and checksum
        if: ${{ always() && env.IPA_PATH != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: GentleNote-0.7.1-build-1-signed-${{ github.sha }}
          path: |
            ${{ runner.temp }}/TestFlightExport/*.ipa
            ${{ runner.temp }}/TestFlightExport/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GentleNote-0.7.1-build-1-test-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/SimulatorDerivedData/Logs/Test/*.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          set +e
          security delete-keychain "$RUNNER_TEMP/gentle-note-signing.keychain-db"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID:-}.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8
          rm -f "$RUNNER_TEMP/GentleNote-Distribution.p12" "$RUNNER_TEMP/GentleNote-AppStore.mobileprovision"
