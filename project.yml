name: GentleNote
options:
  bundleIdPrefix: com.krazel
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.10
    MARKETING_VERSION: 0.8.1
    CURRENT_PROJECT_VERSION: 1
    PRODUCT_BUNDLE_IDENTIFIER: com.krazel.gentlenote.B2X6D3A9J9
    DEVELOPMENT_TEAM: B2X6D3A9J9
    CODE_SIGN_STYLE: Automatic
targets:
  GentleNote:
    type: application
    platform: iOS
    sources:
      - path: GentleNote
    resources:
      - path: GentleNote/Resources
    info:
      path: GentleNote/Info.plist
      properties:
        CFBundleDisplayName: Gentle Note
        CFBundleIconName: AppIcon
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - es
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: Use Face ID to protect your private space in Gentle Note.
        NSCameraUsageDescription: Gentle Note uses the camera only when you choose to take a private photo or record a private video.
        NSMicrophoneUsageDescription: Gentle Note uses the microphone only when you choose to record private audio or video.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  GentleNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GentleNoteTests
    dependencies:
      - target: GentleNote
schemes:
  GentleNote:
    build:
      targets:
        GentleNote: all
        GentleNoteTests: [test]
    test:
      targets:
        - GentleNoteTests
